name: DeepCore Readiness Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness-preflight:
    name: Readiness preflight controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile readiness gate scripts
        run: python -m py_compile PRODUCTION-READINESS-GATES/*.py

      - name: Infrastructure preflight
        run: python PRODUCTION-READINESS-GATES/infrastructure-health-check.py

      - name: Key custody boundary preflight
        run: python PRODUCTION-READINESS-GATES/key-custody-check.py

      - name: Synthetic backup and restore test
        run: python PRODUCTION-READINESS-GATES/backup-restore-check.py

      - name: Synthetic rollback test
        run: python PRODUCTION-READINESS-GATES/rollback-check.py

      - name: Observability contract preflight
        run: python PRODUCTION-READINESS-GATES/observability-check.py

      - name: Gate summary
        run: python PRODUCTION-READINESS-GATES/gate-summary.py | tee readiness-gate-summary.txt

      - name: Run SSIL readiness adversarial suite
        run: python -m unittest discover -s SECURITY/SSIL -p 'test_ssil*.py' -v

      - name: Run all readiness regression tests
        run: python -m unittest discover -s PRODUCTION-READINESS-GATES -p 'test_*.py' -v

      - name: Build machine-readable evidence manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "schema_version": "1.0",
              "evidence_type": "readiness-preflight",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF_NAME"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "controls": {
                  "infrastructure": "preflight-executed",
                  "key_custody": "boundary-preflight-executed",
                  "backup_restore": "synthetic-test-executed",
                  "rollback": "synthetic-test-executed",
                  "observability": "contract-preflight-executed",
              },
              "certification": "NOT_CERTIFIED",
              "external_evidence_required": True,
          }
          Path("readiness-evidence-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify evidence manifest
        run: python PRODUCTION-READINESS-GATES/verify-evidence-manifest.py readiness-evidence-manifest.json

      - name: Verify readiness SSIL audit chain
        run: python PRODUCTION-READINESS-GATES/verify-readiness-ssil-chain.py readiness-evidence-manifest.json

      - name: Write machine-readable SSIL audit record
        run: python PRODUCTION-READINESS-GATES/write-readiness-ssil-audit-record.py readiness-evidence-manifest.json readiness-ssil-audit-record.json

      - name: Upload readiness evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepcore-readiness-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            readiness-evidence-manifest.json
            readiness-gate-summary.txt
            readiness-ssil-audit-record.json
          if-no-files-found: error
          retention-days: 30

      - name: Production certification boundary
        run: |
          echo 'Readiness preflight controls executed successfully.'
          echo 'Evidence manifest was structurally verified before artifact upload.'
          echo 'Readiness evidence was bound to an SSIL decision and verified through an event-sourced audit chain.'
          echo 'SSIL adversarial regression tests executed as part of readiness preflight.'
          echo 'Machine-readable SSIL audit evidence was generated for the workflow artifact.'
          echo 'This workflow does not certify production infrastructure, HSM/KMS custody, disaster recovery, rollback, or live observability.'
          echo 'Production certification remains NOT CERTIFIED until environment-specific evidence is independently verified.'

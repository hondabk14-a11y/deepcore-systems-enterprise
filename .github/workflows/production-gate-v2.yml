name: DeepCore Production Gate V2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ledger test dependencies
        working-directory: CORE/event-sourced-ledger
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run ledger tests
        working-directory: CORE/event-sourced-ledger
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Compile ledger sources
        working-directory: CORE/event-sourced-ledger
        run: python -m py_compile ledger.py test_ledger.py
      - name: Detect tracked secret material
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks)$|(^|/)(secrets|credentials|wallets)/)'; then exit 1; fi
      - name: Verify required controls
        run: |
          test -f AGENTS.md
          test -f .gitignore
          test -f .github/copilot-instructions.md
          test -f CORE/event-sourced-ledger/ledger.py
          test -f CORE/event-sourced-ledger/test_ledger.py
          test -f PRODUCTION-GATE.md
          test -f SECURITY.md
      - name: Gate passed
        run: echo 'DEEPCORE PRODUCTION GATE PASSED'

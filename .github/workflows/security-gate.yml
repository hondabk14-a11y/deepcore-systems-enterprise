name: DeepCore Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: CORE/event-sourced-ledger/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r CORE/event-sourced-ledger/requirements-test.txt

      - name: CodeQL initialization
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Syntax compile check
        run: |
          python -m py_compile CORE/event-sourced-ledger/ledger.py
          python -m py_compile CORE/event-sourced-ledger/test_ledger.py

      - name: Run ledger tests
        run: python -m unittest discover -s CORE/event-sourced-ledger -p 'test_*.py' -v

      - name: Tracked secret-path check
        run: python PRODUCTION-READINESS-GATES/tracked_secret_check.py

      - name: Verify tracked-secret checker regressions
        run: python -m unittest discover -s PRODUCTION-READINESS-GATES -p 'test_tracked_secret_check.py' -v

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v3

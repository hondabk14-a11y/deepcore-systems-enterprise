name: DeepCore VS Code Extension Package

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI/deepcore-ai-bridge/**'
      - '.github/workflows/extension-package.yml'
  pull_request:
    paths:
      - 'AI/deepcore-ai-bridge/**'
      - '.github/workflows/extension-package.yml'

permissions:
  contents: read

concurrency:
  group: extension-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AI/deepcore-ai-bridge/vscode-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install extension tooling
        run: npm install

      - name: Validate extension entrypoint
        run: node --check extension.js

      - name: Validate bridge entrypoint and endpoint classification
        run: |
          node --check ../src/deepcore-ai-bridge.mjs
          node --check ../local-inference-health-check.mjs
          npm --prefix .. run local:test

      - name: Verify extension argument handling
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Validate VSIX contents
        shell: bash
        run: |
          set -euo pipefail
          vsix=$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)
          test -n "$vsix"
          unzip -l "$vsix" | tee /tmp/vsix-contents.txt
          ! grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks)$|(^|/)(secrets|credentials|wallets)/)' /tmp/vsix-contents.txt

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepcore-ai-bridge-vsix-${{ github.sha }}
          path: AI/deepcore-ai-bridge/vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 14

name: DeepCore VS Code Extension Package

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI/deepcore-ai-bridge/vscode-extension/**'

permissions:
  contents: read

concurrency:
  group: extension-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AI/deepcore-ai-bridge/vscode-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AI/deepcore-ai-bridge/vscode-extension/package-lock.json

      - name: Install extension tooling
        run: npm install

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepcore-ai-bridge-vsix-${{ github.sha }}
          path: AI/deepcore-ai-bridge/vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 14

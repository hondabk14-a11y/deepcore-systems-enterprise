name: BKILLINGS v4 Verification

on:
  pull_request:
    paths:
      - 'BKILLINGS_V4/**'
      - '.github/workflows/bkillings-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bkillings-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Protocol, custody, recovery and four-process verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: BKILLINGS_V4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: BKILLINGS_V4/requirements.txt

      - name: Install pinned runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run hardening tests
        run: python -m unittest discover -s tests -v

      - name: Run independent-process harness
        run: |
          mkdir -p ci-evidence
          python cluster_demo.py > ci-evidence/cluster.json

      - name: Validate current-run evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('ci-evidence/cluster.json')
          data = json.loads(path.read_text())
          required = (
              'unauthorized_request_rejected',
              'conflicting_vote_rejected',
              'two_votes_rejected',
              'restart_head_and_identity_preserved',
          )
          assert all(data.get(key) is True for key in required)
          assert data['validator_processes_started'] == 4
          assert data['available_to_finalize'] == 3
          assert data['matching_finalized_heads'] == 3
          assert data['height'] == 1
          assert data['production_certified'] is False
          data['source_sha'] = os.environ['SOURCE_SHA']
          data['workflow_run_id'] = os.environ['RUN_ID']
          data['workflow_run_attempt'] = os.environ['RUN_ATTEMPT']
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Upload current-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: bkillings-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: BKILLINGS_V4/ci-evidence/cluster.json
          if-no-files-found: error
          retention-days: 14

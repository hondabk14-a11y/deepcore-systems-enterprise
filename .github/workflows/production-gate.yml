name: DeepCore Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    name: Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Initialize job logs
        shell: bash
        run: |
          set -euo pipefail
          JOB_LOG_DIR="$RUNNER_TEMP/deepcore-job-logs"
          printf 'JOB_LOG_DIR=%s\n' "$JOB_LOG_DIR" >> "$GITHUB_ENV"
          mkdir -p "$JOB_LOG_DIR"
          printf 'repository=%s\ncommit=%s\nrun_id=%s\nattempt=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$JOB_LOG_DIR/source.txt"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: CORE/event-sourced-ledger/requirements-test.txt

      - name: Install ledger test dependencies
        working-directory: CORE/event-sourced-ledger
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-test.txt 2>&1 | tee "$JOB_LOG_DIR/dependencies.log"

      - name: Run event-sourced ledger tests
        working-directory: CORE/event-sourced-ledger
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s . -p 'test_*.py' -v 2>&1 | tee "$JOB_LOG_DIR/ledger-tests.log"

      - name: Verify ledger source compiles
        working-directory: CORE/event-sourced-ledger
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ledger.py test_ledger.py 2>&1 | tee "$JOB_LOG_DIR/compile.log"

      - name: Check for tracked secret files
        run: python PRODUCTION-READINESS-GATES/tracked_secret_check.py

      - name: Verify tracked-secret detector regression tests
        run: python -m unittest discover -s PRODUCTION-READINESS-GATES -p 'test_tracked_secret_check.py' -v

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .gitignore
          test -f .github/copilot-instructions.md
          test -f CORE/event-sourced-ledger/ledger.py
          test -f CORE/event-sourced-ledger/test_ledger.py

      - name: Build machine-readable gate evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": "1.0",
              "evidence_type": "repository-production-gate",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF_NAME"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "repository_gate": "PASS",
              "controls": {
                  "ledger_tests": "PASS",
                  "ledger_compile": "PASS",
                  "tracked_secret_paths": "PASS",
                  "repository_hygiene": "PASS",
              },
              "production_certified": False,
              "certification_state": "NOT_CERTIFIED",
              "external_evidence_required": [
                  "production_infrastructure",
                  "cryptographic_key_custody",
                  "backup_restore_drill",
                  "rollback_drill",
                  "production_observability",
                  "independent_review",
              ],
          }
          Path("production-gate-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate gate evidence
        run: python -m json.tool production-gate-evidence.json >/dev/null

      - name: Upload gate evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepcore-production-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-gate-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Production gate decision
        run: |
          echo 'DeepCore repository production gate PASSED: required repository, compilation, ledger tests, and secret-file checks completed successfully.'
          echo 'This is repository gate evidence only. Production certification remains NOT CERTIFIED until environment-specific and independent evidence is verified.'

      - name: Record job outcome and log hashes
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          JOB_LOG_DIR="${JOB_LOG_DIR:-$RUNNER_TEMP/deepcore-job-logs}"
          mkdir -p "$JOB_LOG_DIR"
          printf 'job_status=%s\n' "$JOB_STATUS" > "$JOB_LOG_DIR/outcome.txt"
          cd "$JOB_LOG_DIR"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS

      - name: Upload job logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deepcore-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.JOB_LOG_DIR }}
          if-no-files-found: error
          retention-days: 30

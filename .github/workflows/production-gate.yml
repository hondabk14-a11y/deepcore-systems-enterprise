name: DeepCore Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    name: Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: CORE/event-sourced-ledger/requirements-test.txt

      - name: Install ledger test dependencies
        working-directory: CORE/event-sourced-ledger
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run event-sourced ledger tests
        working-directory: CORE/event-sourced-ledger
        run: python -m unittest discover -s . -p 'test_*.py' -v

      - name: Verify ledger source compiles
        working-directory: CORE/event-sourced-ledger
        run: python -m py_compile ledger.py test_ledger.py

      - name: Check for tracked secret files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks)$|(^|/)(secrets|credentials|wallets)/)' ; then
            echo 'Potential secret material is tracked in Git.'
            exit 1
          fi

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .gitignore
          test -f .github/copilot-instructions.md
          test -f CORE/event-sourced-ledger/ledger.py
          test -f CORE/event-sourced-ledger/test_ledger.py

      - name: Production gate decision
        run: |
          echo 'DeepCore production gate PASSED: required repository, compilation, ledger tests, and secret-file checks completed successfully.'

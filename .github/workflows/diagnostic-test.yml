name: DeepCore Diagnostic Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-test.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-test.yml'

permissions:
  contents: read

jobs:
  diagnostic-startup:
    name: Diagnostic Startup Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify runner is available
        run: |
          echo "Runner job successfully created"
          echo "GitHub Run ID: $GITHUB_RUN_ID"
          echo "Workflow: $GITHUB_WORKFLOW"

      - name: Check Python availability
        run: |
          python --version
          python -m pip --version

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify repository structure
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for dir in CORE ARCHITECTURE SECURITY; do
            if [[ -d "$dir" ]]; then
              printf 'PASS directory: %s\n' "$dir"
            else
              printf 'FAIL missing directory: %s\n' "$dir" >&2
              missing=$((missing + 1))
            fi
          done
          for file in README.md; do
            if [[ -f "$file" ]]; then
              printf 'PASS file: %s\n' "$file"
            else
              printf 'FAIL missing file: %s\n' "$file" >&2
              missing=$((missing + 1))
            fi
          done
          if (( missing > 0 )); then
            printf 'Repository structure check failed: %d missing path(s)\n' "$missing" >&2
            exit 1
          fi

      - name: Diagnostic summary
        run: |
          echo "DeepCore diagnostic PASSED: runner, Python, checkout and required paths verified."
          echo "This does not certify the production gate or any other workflow."
          echo "NEXT STEPS:"
          echo "1. If other runs still show BuildFailed/startup_failure with zero jobs, check GitHub billing and Actions policy."
          echo "2. Escalate unresolved pre-job failures to GitHub Support; do not delete workflow records on assumption."
          echo "3. Run production-gate, security-gate, DeepCore CI and readiness-preflight."
          echo "4. Require actual passed jobs and recorded artifacts before considering the repository gate verified."

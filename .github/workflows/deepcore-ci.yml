name: DeepCore CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Runtime, cryptography, and consensus verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Execute reference runtime
        run: python CORE/deepcore_runtime.py

      - name: Run runtime, cryptography, and consensus tests
        run: python -m pytest -q tests/test_deepcore_runtime.py tests/test_deepcore_crypto.py tests/test_deepcore_consensus.py tests/test_deepcore_hotstuff.py

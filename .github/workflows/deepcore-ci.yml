name: DeepCore CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Runtime, cryptography, consensus, transport, persistence, fault recovery, SSIL, UST, and market-data verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Execute reference runtime
        run: python CORE/deepcore_runtime.py

      - name: Run DeepCore and UST verification suite
        run: >-
          python -m pytest -q
          tests/test_deepcore_runtime.py
          tests/test_deepcore_crypto.py
          tests/test_deepcore_consensus.py
          tests/test_deepcore_hotstuff.py
          tests/test_deepcore_transport.py
          tests/test_deepcore_persistence.py
          tests/test_deepcore_fault_injection.py
          tests/test_deepcore_ssil_systemic_integrity.py
          tests/test_ust_settlement.py
          tests/test_ust_ssil_gate.py
          tests/test_ust_controller.py

      - name: Run CoinGecko observation and SDK adapter verification
        run: >-
          python -m pytest -q
          MARKET-DATA/test_coingecko_observation.py
          MARKET-DATA/test_coingecko_sdk_adapter.py

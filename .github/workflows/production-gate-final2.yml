name: DeepCore Production Gate Final 2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        working-directory: CORE/event-sourced-ledger
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Execute ledger tests
        working-directory: CORE/event-sourced-ledger
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Compile
        working-directory: CORE/event-sourced-ledger
        run: python -m py_compile ledger.py test_ledger.py
      - name: Secret-file check
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks)$|(^|/)(secrets|credentials|wallets)/)'
      - name: Required controls
        run: |
          test -f AGENTS.md
          test -f .gitignore
          test -f .github/copilot-instructions.md
          test -f CORE/event-sourced-ledger/ledger.py
          test -f CORE/event-sourced-ledger/test_ledger.py
          test -f PRODUCTION-GATE.md
          test -f SECURITY.md
      - run: echo 'DEEPCORE PRODUCTION GATE PASSED'

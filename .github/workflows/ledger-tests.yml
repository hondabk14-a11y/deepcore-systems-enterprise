name: DeepCore Ledger Tests

on:
  push:
    paths:
      - 'CORE/event-sourced-ledger/**'
      - '.github/workflows/ledger-tests.yml'
  pull_request:
    paths:
      - 'CORE/event-sourced-ledger/**'
      - '.github/workflows/ledger-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        working-directory: CORE/event-sourced-ledger
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run ledger tests and collect replay evidence
        working-directory: CORE/event-sourced-ledger
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python replay_evidence.py
          --commit "$SOURCE_COMMIT"
          --build-id "$BUILD_ID"
          --output ../../replay-evidence/replay-evidence.json

      - name: Upload replay evidence and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-replay-evidence
          path: replay-evidence/
          if-no-files-found: error
          retention-days: 30

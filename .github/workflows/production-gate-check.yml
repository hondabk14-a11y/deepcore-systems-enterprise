name: DeepCore Production Gate Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: CORE/event-sourced-ledger
        run: python -m pip install -r requirements-test.txt
      - name: Test ledger
        working-directory: CORE/event-sourced-ledger
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Compile
        working-directory: CORE/event-sourced-ledger
        run: python -m py_compile ledger.py test_ledger.py
      - name: Required files
        run: test -f AGENTS.md && test -f SECURITY.md && test -f PRODUCTION-GATE.md
      - name: Production gate PASS
        run: echo DEEPCORE_PRODUCTION_GATE_PASSED

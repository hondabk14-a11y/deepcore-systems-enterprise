name: DeepCore Production Gate Single

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: CORE/event-sourced-ledger
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run tests
        working-directory: CORE/event-sourced-ledger
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Compile
        working-directory: CORE/event-sourced-ledger
        run: python -m py_compile ledger.py test_ledger.py
      - name: Secret check
        run: |
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks)$|(^|/)(secrets|credentials|wallets)/)'
      - name: Gate
        run: echo 'DEEPCORE_PRODUCTION_GATE_PASSED'

name: DeepCore Production Gate V3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-gate:
    name: DeepCore Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        working-directory: CORE/event-sourced-ledger
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Ledger test suite
        working-directory: CORE/event-sourced-ledger
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Python compile gate
        working-directory: CORE/event-sourced-ledger
        run: python -m py_compile ledger.py test_ledger.py
      - name: Tracked secret-file gate
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks)$|(^|/)(secrets|credentials|wallets)/)'; then
            echo 'Tracked secret material detected.'
            exit 1
          fi
      - name: Required-control gate
        run: |
          set -euo pipefail
          for f in AGENTS.md .gitignore .github/copilot-instructions.md CORE/event-sourced-ledger/ledger.py CORE/event-sourced-ledger/test_ledger.py PRODUCTION-GATE.md SECURITY.md; do test -f "$f"; done
      - name: Production gate result
        run: echo 'DEEPCORE PRODUCTION GATE PASSED'

services:
  simulation:
    build:
      context: ../..
      dockerfile: deploy/simulation/Dockerfile
      secrets:
        - ca_bundle
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - simulation-state:/data
      - /etc/ssl/certs/ca-certificates.crt:/run/ca-bundle.crt:ro
    environment:
      SSL_CERT_FILE: /run/ca-bundle.crt
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  simulation-state:
secrets:
  ca_bundle:
    file: /etc/ssl/certs/ca-certificates.crt
